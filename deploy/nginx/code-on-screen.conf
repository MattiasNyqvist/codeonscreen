# nginx site for Code On Screen – a static site, nginx only serves files.
#
# Install:  sudo cp code-on-screen.conf /etc/nginx/sites-available/
#           sudo cp security-headers.conf /etc/nginx/snippets/code-on-screen-security.conf
#           sudo ln -s /etc/nginx/sites-available/code-on-screen.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d codeonscreen.example.com
#           (certbot adds the 443 block and the redirect from http to https)
#
# Replace codeonscreen.example.com with your subdomain.

server {
    listen 80;
    listen [::]:80;
    server_name codeonscreen.example.com;

    root /var/www/code-on-screen;
    index index.html;

    # Compress text files on the fly. Fonts in woff2 are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    # Vite puts a content hash in every file name under /assets/, so a file
    # there never changes: browsers may keep it for a year.
    location /assets/ {
        include snippets/code-on-screen-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, favicon) must be checked on every visit,
    # otherwise visitors keep running an old version after a deploy.
    location / {
        include snippets/code-on-screen-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
