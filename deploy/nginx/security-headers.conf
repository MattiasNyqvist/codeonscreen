# Security headers for Code On Screen, included in every location block.
#
# Why a separate file: nginx only inherits add_header from the server block if
# the location has no add_header of its own. Our locations add Cache-Control,
# so the security headers must be repeated – an include keeps that in one place.

# Only load code from our own origin. Monaco injects <style> tags at runtime,
# hence 'unsafe-inline' for styles (not for scripts). Workers are same-origin files.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# Never guess content types; never allow the site inside a frame on another site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The app uses no camera, microphone or location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
